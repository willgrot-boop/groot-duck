[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microduck-prototype"
version = "0.1.0"
description = "Simulation-first Pi and ESP32 scaffold for an eight-servo DIY biped"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
microduck = "microduck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
