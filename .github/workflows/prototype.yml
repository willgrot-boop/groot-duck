name: Prototype checks
on: [push, pull_request]
jobs:
  host-and-safety:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m microduck check-config
      - run: python -m microduck simulate --duration 0.1
      - run: bash firmware/test_native.sh
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: e03d8ae8857098b377fb5c95b9b2357ebf15ddff
          path: .cache/arduinojson
      - run: ARDUINOJSON_INCLUDE_DIR="$GITHUB_WORKSPACE/.cache/arduinojson/src" bash firmware/test_protocol.sh
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d firmware
